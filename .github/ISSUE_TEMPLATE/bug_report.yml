name: Bug report
description: Report a problem with an agent definition, docs, or configuration.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include the agent(s) and CLI commands involved.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Copilot CLI version, OS, and model in use.
    validations:
      required: false
